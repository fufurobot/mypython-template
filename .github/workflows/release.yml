name: release

# Builds the package and the devcontainer image, then publishes them:
#   - the package to TestPyPI through a Trusted Publisher (OIDC, no token)
#   - the devcontainer image to the GitHub Container Registry
#   - the package artifacts as a GitHub release, when a v* tag is pushed
#
# The TestPyPI pending publisher must name this repository, this workflow file,
# and the testpypi environment.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The image is named after the repository, so a fork does not write to the
  # same tag.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate the package
        run: bash .devcontainer/build-package.sh "$RUNNER_TEMP" "$GITHUB_REPOSITORY"

      - name: Show what will be published
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          ls -l
          python3 - <<'PY'
          import glob
          import zipfile

          for wheel in glob.glob("*.whl"):
              print(wheel)
              for name in zipfile.ZipFile(wheel).namelist():
                  print("  ", name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mypython-template-fufurobot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Publish API attestations are signed through Sigstore's Rekor log,
          # which has answered 502 to this repository's runners; publishing
          # does not depend on them, so they are off until Rekor is reliable.
          attestations: false

  image:
    name: build the devcontainer image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          # The base image is published for linux/amd64 only, so a build for
          # another platform cannot resolve it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Re-running a tag replaces the assets instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Built from ${GITHUB_SHA::7}."
          fi
